# Single container. Data lives in MongoDB (Atlas): set DATABASE_URL in the environment or a .env file next to this
# file, e.g. mongodb+srv://<user>:<password>@<cluster-host>/spring_inventory?retryWrites=true&w=majority
# Uploaded receipts / PO documents are kept on the named volume `inventory-data`.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the MongoDB connection string}
      UPLOAD_DIR: /data/uploads
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-in-production-please}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: production
    volumes:
      - inventory-data:/data
    ports:
      - "3000:3000"

volumes:
  inventory-data:
